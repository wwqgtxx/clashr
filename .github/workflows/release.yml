name: Release
on: [push]
jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: "linux-386 linux-amd64 linux-amd64-v3", id: "1" }
          - { target: "linux-armv5 linux-armv6 linux-armv7", id: "2" }
          - { target: "linux-arm64 linux-loong64 linux-riscv64", id: "3" }
          - { target: "linux-mips64 linux-mips64le", id: "4" }
          - { target: "linux-mips-softfloat linux-mips-hardfloat linux-mipsle-softfloat linux-mipsle-hardfloat", id: "5" }
          - { target: "freebsd-386 freebsd-amd64 freebsd-amd64-v3 freebsd-arm64", id: "6" }
          - { target: "windows-386 windows-amd64 windows-amd64-v3 windows-arm64", id: "7" }
          - { target: "darwin-amd64 darwin-amd64-v3 darwin-arm64", id: "8" }
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Verify Go installation
        run: go version

      - name: Verify Go env
        run: go env

      # TODO: remove after issue77930 fixed, see: https://github.com/golang/go/issues/77930
      - name: Fix issue77930 for Golang1.26
        if: ${{ matrix.jobs.goversion == '' }}
        run: |
          cd $(go env GOROOT)
          patch --verbose -p 1 < $GITHUB_WORKSPACE/.github/patch/issue77930.patch

      - name: Set variables
        run: echo "VERSION=$(git describe --tags)" >> $GITHUB_ENV
        shell: bash

      - name: Set ENV
        run: |
          echo "GOTOOLCHAIN=local" >> $GITHUB_ENV
        shell: bash

      - name: Get dependencies, run test
        if: ${{ matrix.job.id=='1' }}
        run: |
          export SKIP_CONCURRENT_TEST=1
          go test ./...
          echo "---test with_gvisor---"
          go test ./... -tags "with_gvisor" -count=1

      - name: Update CA
        run: |
          sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Update Country.mmdb
        run: |
          cd component/mmdb
          rm Country.mmdb
          wget -O Country.mmdb https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-only-cn-private.mmdb
      #          wget -O Country.mmdb https://raw.githubusercontent.com/JMVoid/ipip2mmdb/release/Country.mmdb

      - name: Build
        #        if: startsWith(github.ref, 'refs/tags/')
        env:
          NAME: mihomo
          BINDIR: bin
        run: |
          make -j$(($(nproc) + 1)) ${{ matrix.job.target }}
          cd bin
          ls -la
          chmod +x *
          cp ../.github/release.sh ./
          bash ./release.sh
          rm ./release.sh
          ls -la
          cd ..

      - name: Pack Golang Toolchain
        if: ${{ matrix.job.id=='1' }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain/go
          cp -r $(go env GOROOT)/* $GITHUB_WORKSPACE/toolchain/go/
          cd $GITHUB_WORKSPACE/toolchain/
          tar -czf $GITHUB_WORKSPACE/bin/toolchain.tar.gz .
          rm -rf $GITHUB_WORKSPACE/toolchain

      - name: Pack GoMod Vendor
        if: ${{ matrix.job.id=='1' }}
        run: |
          go mod vendor
          tar -czf $GITHUB_WORKSPACE/bin/vendor.tar.gz vendor

      - name: Update Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.job.id }}
          path: bin/
          retention-days: 1

  merge:
    permissions: write-all
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: bin
          pattern: bin-*
          merge-multiple: true
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: bin
          pattern: bin-*
          delete-merged: true
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bin/*
          draft: true
